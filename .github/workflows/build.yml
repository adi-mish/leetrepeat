name: Build and test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev \
            libqt6sql6-sqlite qt6-qpa-plugins qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Application startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ./build/leetrepeat --database "$RUNNER_TEMP/smoke.sqlite" --smoke-test
